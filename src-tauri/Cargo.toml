[package]
name = "aurora-launcher"
version = "0.1.0"
description = "Launcher for the Aurora client mod for Minecraft: Java Edition"
authors = ["Aurora Launcher contributors"]
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aurora_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "system-proxy",
] }
# reqwest's default rustls provider (aws-lc-rs) needs CMake/NASM on some hosts;
# the ring provider builds with a plain C compiler, so the launcher supplies it.
rustls = { version = "0.23", default-features = false, features = [
    "logging",
    "ring",
    "std",
    "tls12",
] }
# SHA-1 is Mojang's official metadata/artifact digest algorithm (Phase 3);
# RustCrypto implementation matching the existing sha2 dependency family.
sha1 = "0.10"
sha2 = "0.10"
# tokio is already the async runtime Tauri runs commands on; Phase 5 enables
# `sync` for the per-instance installation exclusion mutex (no new crate).
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "sync"] }
url = "2"
# ZIP-only archive support (Phase 5): Minecraft native artifacts are ZIP/JAR
# files. Focused maintained implementation (zip-rs); `deflate` covers the
# compression real native jars use, everything else stays off.
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

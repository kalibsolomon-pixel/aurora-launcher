[package]
name = "aurora-launcher"
version = "0.1.0"
description = "Launcher for the Aurora client mod for Minecraft: Java Edition"
authors = ["Aurora Launcher contributors"]
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aurora_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "system-proxy",
] }
# reqwest's default rustls provider (aws-lc-rs) needs CMake/NASM on some hosts;
# the ring provider builds with a plain C compiler, so the launcher supplies it.
rustls = { version = "0.23", default-features = false, features = [
    "logging",
    "ring",
    "std",
    "tls12",
] }
# SHA-1 is Mojang's official metadata/artifact digest algorithm (Phase 3);
# RustCrypto implementation matching the existing sha2 dependency family.
sha1 = "0.10"
sha2 = "0.10"
# Tokio is already Tauri's async runtime. `sync` owns narrow install locks;
# Phase 7's `process` + `time` bound structured managed-Java diagnostics;
# Phase 8's `macros` provides the `select!` used to race the OAuth callback
# receiver against login cancellation and timeout.
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "macros", "process", "sync", "time"] }
url = "2"
# Instance identifier generation (Phase 6): opaque, collision-resistant UUIDv4
# in the canonical simple (hyphen-less) lowercase-hex form. Focused and
# universally maintained; v4 needs the `rng` feature's OS entropy.
uuid = { version = "1.26", features = ["v4"] }
# OS entropy for OAuth PKCE verifiers and state (Phase 8): the same crate the
# `uuid` dependency already reaches for v4 randomness, pinned as a direct
# dependency because Aurora generates its own challenge material.
getrandom = "0.3"
# Unpadded base64url for PKCE S256 challenges and OAuth state (Phase 8).
# RustCrypto implementation matching the existing sha1/sha2 dependency family.
base64ct = { version = "1", features = ["alloc"] }
# System-browser opening for OAuth (Phase 8): the official Tauri 2 opener
# plugin; only its synchronous free functions are used from Rust, so no
# frontend capability is granted.
tauri-plugin-opener = "2"
# ZIP-only archive support (Phase 5): Minecraft native artifacts are ZIP/JAR
# files. Focused maintained implementation (zip-rs); `deflate` covers the
# compression real native jars use, everything else stays off.
zip = { version = "8.6", default-features = false, features = ["deflate"] }

# Windows credential storage (Phase 8): the official Microsoft raw bindings,
# restricted to the generic Windows Credential Manager API. Linux and macOS
# builds compile the portable trait only and fail deliberately until their
# platform phases own a backed store. Version pinned to the copy already in
# the dependency tree.
# Windows shell shortcuts (desktop integration): the same official Microsoft
# bindings family, restricted to the shell link COM API (IShellLinkW /
# IPersistFile), COM initialization, known-folder resolution, and the
# WIN32_FIND_DATAW the shell link reader requires. Already resolved in the
# dependency tree via Tauri's WebView2 bindings, so no new code is added.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
] }
windows = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

# Deterministic asset-invariant tests (external icon phase): the PNG decoder
# already resolved in the dependency tree through Tauri, used in tests only
# to verify the generated external identity pixels directly.
[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "process", "rt", "time"] }
png = "0.17"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
